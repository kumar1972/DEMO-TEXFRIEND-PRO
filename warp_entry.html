<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Warp Entry - TEXFRIEND ERP</title>

<script src="config.js"></script>
<script src="translator.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }

    html,
    body {
        width: 100%;
        min-height: 100vh;
        background: #030712;
        color: #1E2B23;
    }

    body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421;
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }

    .back-btn:hover {
        background: #000000;
        transform: translateY(-2px);
    }

    #bitmapDisplayContainer {
        text-align: right;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #bitmapDisplayContainer img {
        max-height: 45px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        cursor: zoom-in;
        transition: transform 0.3s;
    }

    #bitmapDisplayContainer img:hover {
        transform: scale(1.1);
    }

    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
    }

    .completed-checkbox label {
        margin: 0;
        color: #3F5A3E;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    .page-title {
        font-size: 16px;
        font-weight: 700;
        color: #2F4F38;
        text-align: left;
        position: relative;
        padding-left: 12px;
        margin-bottom: 5px;
    }

    .page-title::before {
        content: '';
        position: absolute;
        left: 0;
        top: 10%;
        height: 80%;
        width: 4px;
        background: #4A7C59;
        border-radius: 4px;
    }

    .form-section {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 14px;
        padding: 22px 15px 15px 15px;
        margin-bottom: 5px;
        position: relative;
    }

    .section-badge {
        position: absolute;
        top: -12px;
        left: 15px;
        background: #4A7C59;
        color: #FFF;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
    }

    .section-badge.blue {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        box-shadow: 0 4px 8px rgba(59, 130, 246, 0.25);
    }

    .section-badge.amber {
        background: linear-gradient(135deg, #F59E0B, #D97706);
        box-shadow: 0 4px 8px rgba(217, 119, 6, 0.25);
    }

    .bulk-color-box {
        background: #EAF0EA;
        border: 1px dashed #4A7C59;
        border-radius: 10px;
        padding: 10px 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }

    .bulk-color-box label {
        font-size: 11px;
        font-weight: 700;
        color: #2F4F38;
        white-space: nowrap;
    }

    .bulk-color-box select,
    .bulk-color-box input {
        flex: 1;
        min-width: 100px;
        padding: 8px 10px;
        font-size: 11px;
        background: #FFFFFF;
        color: #1E2B23;
    }

    .btn-bulk-change {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(59, 130, 246, 0.25);
        white-space: nowrap;
        transition: all 0.2s;
    }

    .btn-bulk-change:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(59, 130, 246, 0.35);
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .form-group label {
        font-size: 10px;
        font-weight: 600;
        color: #4A554A;
        white-space: nowrap;
    }

    input,
    select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    input:focus,
    select:focus {
        border-color: #4A7C59;
        outline: none;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    .input-group-btn {
        display: flex;
        gap: 10px;
        width: 100%;
    }

    .input-group-btn input,
    .input-group-btn select {
        flex: 1;
        background: #FFFFFF;
        color: #1E2B23;
    }

    .btn-copy-design {
        background: linear-gradient(135deg, #8B5CF6, #6D28D9);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(139, 92, 246, 0.25);
        white-space: nowrap;
        transition: all 0.2s;
    }

    .btn-copy-design:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(139, 92, 246, 0.35);
    }

    .header-grid {
        display: grid;
        grid-template-columns: 25px 1fr 1fr 0.9fr 1fr 65px;
        gap: 4px;
        padding: 5px 0;
        font-size: 9px;
        font-weight: 700;
        color: #2F4F38;
        text-align: center;
        text-transform: uppercase;
    }

    .row-grid {
        display: grid;
        grid-template-columns: 25px 1fr 1fr 0.9fr 1fr 65px;
        gap: 4px;
        margin-bottom: 8px;
        align-items: center;
    }

    .header-grid-range {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 35px;
        gap: 6px;
        padding: 5px 0;
        font-size: 10px;
        font-weight: 700;
        color: #2F4F38;
        text-align: center;
        text-transform: uppercase;
    }

    .row-grid-range {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 35px;
        gap: 6px;
        margin-bottom: 8px;
        align-items: center;
    }

    .row-grid input,
    .row-grid select,
    .row-grid-range input {
        text-align: center;
        padding: 8px 2px;
        font-size: 11px;
        background: #FFFFFF;
        color: #1E2B23;
    }

    .line-no {
        font-size: 10px;
        font-weight: 800;
        color: #4A7C59;
        text-align: center;
        background: #EAF0EA;
        padding: 8px 0;
        border-radius: 6px;
        border: 1px solid #D1DED1;
    }

    .btn-add-small {
        background: linear-gradient(135deg, #10B981, #059669);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    .action-cell-row {
        display: flex;
        gap: 4px;
        width: 100%;
    }

    .btn-insert-small {
        background: #D1FAE5;
        color: #059669;
        border: none;
        width: 100%;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-insert-small:hover {
        background: #A7F3D0;
        transform: scale(1.05);
    }

    .btn-del-small {
        background: #FEE2E2;
        color: #DC2626;
        border: none;
        width: 100%;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-del-small:hover {
        background: #FECACA;
        transform: scale(1.05);
    }

    .action-btns-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 10px;
    }

    .btn-main {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-main:hover {
        transform: translateY(-2px);
    }

    .btn-preview {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25);
    }

    .btn-save {
        background: linear-gradient(135deg, #AC7CAA, #33593D);
        box-shadow: 0 6px 15px rgba(74, 124, 89, 0.25);
    }

    .btn-list {
        background: linear-gradient(135deg, #F59E0B, #D97706);
        box-shadow: 0 6px 15px rgba(245, 158,11,0.25);
    }

    .overlay-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(18, 25, 20, 0.95);
        backdrop-filter: blur(6px);
        z-index: 99999;
        flex-direction: column;
        padding: 0;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .overlay-modal.show {
        opacity: 1;
    }

    .modal-content {
        background: #FFFFFF;
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(1);
    }

    .modal-header {
        padding: 15px 20px;
        background: #F4F7F4;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #E2E8E2;
        flex-shrink: 0;
    }

    .modal-header h3 {
        margin: 0;
        font-size: 16px;
        color: #4A7C59;
        font-weight: 800;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
    }

    .close-btn {
        background: #FEE2E2;
        color: #DC2626;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 12px;
    }

    .print-btn {
        background: linear-gradient(135deg, #10B981, #059669);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 12px;
    }

    .modal-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        background: #FAFCFA;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
    }

    .fullscreen-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 999999;
        justify-content: center;
        align-items: center;
        padding: 20px;
        flex-direction: column;
    }

    .fullscreen-modal img {
        max-width: 100%;
        max-height: 85vh;
        object-fit: contain;
        border-radius: 10px;
    }

    .close-fullscreen {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #EF4444;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    .table-container {
        width: 100%;
        border-radius: 10px;
        overflow-x: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        border: 1px solid #E2E8E2;
        background: #FFFFFF;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
    }

    th,
    td {
        padding: 10px 12px;
        text-align: center;
        color: #1E2B23;
    }

    .action-cell {
        display: flex;
        gap: 4px;
        justify-content: center;
    }

    .edit-action-btn {
        background: #64748B;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 10px;
    }

    .del-action-btn {
        background: #EF4444;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 10px;
    }

    .action-complete {
        background: #526E51;
        color: white;
        border: none;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 9px;
        font-weight: bold;
    }

    .action-running {
        background: #D97706;
        color: white;
        border: none;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 9px;
        font-weight: bold;
    }

    /* 🟢 STRICT PRINT STYLES FOR PREVIEW MODAL TO HIDE MAIN PAGE & FORCE PURE WHITE 🟢 */
    @media print {
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        body * {
            visibility: hidden !important;
        }

        #previewModal,
        #previewModal * {
            visibility: visible !important;
        }

        #previewModal {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: #FFFFFF !important;
            display: block !important;
            z-index: 999999 !important;
        }

        .overlay-modal {
            background: #FFFFFF !important;
        }

        .modal-content {
            background: #FFFFFF !important;
            width: 100% !important;
            height: auto !important;
            box-shadow: none !important;
            border: none !important;
        }

        .no-print {
            display: none !important;
        }

        .modal-body {
            background: #FFFFFF !important;
            padding: 0 !important;
            width: 100% !important;
        }

        html,
        body {
            background: #FFFFFF !important;
            color: #000000 !important;
        }
    }
</style>
</head>

<body>

<div class="main-card">

    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>

        <div id="bitmapDisplayContainer">
            <div class="completed-checkbox">
                <input type="checkbox"
                       id="top_completed_status"
                       onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
        </div>
    </div>

    <h2 class="page-title">📐 Warp Pattern Entry</h2>

    <div class="form-section" style="margin-top: 5px;">

        <div class="section-badge">General Specs</div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Design Number</label>

            <div class="input-group-btn">
                <!-- 🟢 Editable Input with Datalist 🟢 -->
                <input type="text" id="designNo" list="designList" placeholder="Select or type Design No" onchange="loadDesignData()" autocomplete="off">
                <datalist id="designList"></datalist>

                <button class="btn-copy-design"
                        onclick="copyToNewDesign()"
                        title="Copy current pattern to a new design">
                    📋 Copy Design
                </button>

            </div>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Order Mtrs</label>
                <input type="number"
                       id="infoOrderMtr"
                       placeholder="Mtrs"
                       step="0.01"
                       oninput="calculateTopBeam()">
            </div>

            <div class="form-group">
                <label>Top Beam Mtrs</label>
                <input type="text"
                       id="infoTopBeam"
                       placeholder="e.g. 130 or +30%"
                       onblur="calculateTopBeam()"
                       onchange="calculateTopBeam()">
            </div>

            <div class="form-group">
                <label>Fabric Type</label>
                <!-- 🟢 Editable Input with Datalist 🟢 -->
                <input type="text" id="infoType" list="fabricTypeList" value="Plain" placeholder="Select or Type">
                <datalist id="fabricTypeList">
                    <option value="Plain"></option>
                    <option value="Twill"></option>
                    <option value="Dobby"></option>
                    <option value="Seersucker"></option>
                </datalist>
            </div>

        </div>

        <div class="form-grid"
             style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); background:#FFFFFF; padding:12px; border-radius:10px; border:1px dashed #D1DED1; margin-top:5px;">

            <div class="form-group">
                <label>Count 1 (Warp)</label>
                <input type="text" id="infoCount1" placeholder="C1">
            </div>

            <div class="form-group">
                <label>Count 2 (Warp)</label>
                <input type="text" id="infoCount2" placeholder="C2">
            </div>

            <div class="form-group">
                <label>Weft 1</label>
                <input type="text" id="infoWeft1" placeholder="W1">
            </div>

            <div class="form-group">
                <label>Weft 2</label>
                <input type="text" id="infoWeft2" placeholder="W2">
            </div>

            <div class="form-group">
                <label>Onloom.Reed</label>
                <input type="text"
                       id="infoReed"
                       placeholder="Reed"
                       oninput="calculateOnloomWidth()">
            </div>

            <div class="form-group">
                <label>Onloom.Pick</label>
                <input type="text" id="infoPick" placeholder="Pick">
            </div>

            <div class="form-group">
                <label>Onloom.Width</label>
                <input type="text" id="infoWidth" placeholder="Width">
            </div>

        </div>

    </div>

    <div class="form-section">

        <div class="section-badge blue">Warp Thread Pattern</div>

        <div class="bulk-color-box">

            <label>🎨 Bulk Color Changer:</label>

            <select id="bulkOldColor">
                <option value="">Select Old Color</option>
            </select>

            <label>To ➔</label>

            <input type="text"
                   id="bulkNewColor"
                   placeholder="Type New Color">

            <button class="btn-bulk-change"
                    onclick="applyBulkColorChange()">
                Change Color
            </button>

        </div>

        <div style="font-size:9px;color:#10B981;font-weight:600;text-align:right;margin-bottom:5px;">
            (Press Enter in Ends to add new line below)
        </div>

        <div style="overflow-x:auto;">

            <div style="min-width:480px;">

                <div class="header-grid">
                    <div>#</div>
                    <div>Count</div>
                    <div>Colour</div>
                    <div>Beam</div>
                    <div>Ends</div>
                    <div>Action</div>
                </div>

                <div id="warpLinesContainer"></div>

            </div>

        </div>

    </div>

    <div class="form-section">

        <div class="section-badge amber">Pattern Repeats (Groups)</div>

        <div style="text-align:right;margin-bottom:5px;">
            <button class="btn-add-small"
                    onclick="addWarpRange()">
                ➕ Add Range
            </button>
        </div>

        <div style="overflow-x:auto;">

            <div style="min-width:350px;">

                <div class="header-grid-range">
                    <div>Start Line</div>
                    <div>End Line</div>
                    <div>X (Times)</div>
                    <div></div>
                </div>

                <div id="warpRangesContainer"></div>

            </div>

        </div>

    </div>

    <div class="action-btns-row">

        <button class="btn-main btn-preview"
                onclick="previewPattern()">
            👁️ Preview
        </button>

        <button class="btn-main btn-save" id="saveBtnTxt"
                onclick="saveWarpDesign(); update3DPreviewData()">
            💾 Save
        </button>

        <button class="btn-main btn-list"
                onclick="openSavedModal()">
            📂 Saved List
        </button>

    </div>

</div>


<!-- PREVIEW MODAL -->

<div id="previewModal" class="overlay-modal">

    <div class="modal-content">

        <div class="modal-header no-print">

            <h3>👁️ Warp Pattern Full Screen Preview</h3>

            <div class="modal-actions">

                <button class="print-btn"
                        onclick="window.print()">
                    🖨️ Print
                </button>

                <button class="close-btn"
                        onclick="closeModal('previewModal')">
                    Close ✕
                </button>

            </div>

        </div>

        <div class="modal-body"
             id="previewContent">
        </div>

    </div>

</div>


<!-- SAVED LIST MODAL -->

<div id="savedListModal"
     class="overlay-modal">

    <div class="modal-content"
         style="max-width:600px;height:90vh;margin:auto;border-radius:16px;">

        <div class="modal-header">

            <h3>📋 Saved Warp Patterns</h3>

            <button class="close-btn"
                    onclick="closeModal('savedListModal')">
                Close ✕
            </button>

        </div>

        <div class="modal-body">

            <div class="table-container">

                <table>

<!-- FULLSCREEN IMAGE -->

<div id="fullscreenModal"
     class="fullscreen-modal"
     onclick="closeFullscreenImage()">

    <button class="close-fullscreen"
            onclick="event.stopPropagation();closeFullscreenImage()">
        Close ✕
    </button>

    <img id="fullscreenImg"
         src=""
         alt="Fullscreen Preview">

</div>


<script>

let currentBaseSpecs = {};


/* ============================================================
   SAFE STORAGE
============================================================ */

function safeJSONParse(value, fallback) {
    try {
        if (value === null || value === undefined || value === '') {
            return fallback;
        }

        const parsed = JSON.parse(value);

        return parsed === null || parsed === undefined
            ? fallback
            : parsed;

    } catch (e) {
        console.warn('JSON parse error:', e);
        return fallback;
    }
}


function getLocalArray(key) {
    const data = safeJSONParse(localStorage.getItem(key), []);
    return Array.isArray(data) ? data : [];
}


function getLocalObject(key) {
    const data = safeJSONParse(localStorage.getItem(key), {});
    return data && typeof data === 'object' && !Array.isArray(data)
        ? data
        : {};
}


/* ============================================================
   PERMISSION
============================================================ */

function checkUserPermission() {

    let userRole =
        localStorage.getItem('erp_logged_role') ||
        localStorage.getItem('user_role');

    if (userRole !== 'Administrator' && userRole !== 'Admin') {

        let permissions =
            safeJSONParse(
                localStorage.getItem('user_permissions'),
                {}
            );

        if (
            permissions['warp_entry.html'] === false ||
            permissions['warp_entry'] === false
        ) {
            return false;
        }
    }

    return true;
}


/* ============================================================
   INITIAL LOAD
============================================================ */

document.addEventListener('DOMContentLoaded', function () {

    if (!checkUserPermission()) {

        alert(
            "Access Denied! You do not have permission to access this page. ❌"
        );

        window.location.href = "dashboard.html";
        return;
    }

    loadDesignDropdown();
});


/* ============================================================
   MODALS
============================================================ */

function openModal(modalId) {

    const modal = document.getElementById(modalId);

    if (!modal) return;

    modal.style.display = 'flex';

    setTimeout(function () {
        modal.classList.add('show');
    }, 10);
}


function closeModal(modalId) {

    const modal = document.getElementById(modalId);

    if (!modal) return;

    modal.classList.remove('show');

    setTimeout(function () {
        modal.style.display = 'none';
    }, 300);
}


/* ============================================================
   FULLSCREEN IMAGE
============================================================ */

window.openFullscreenImage = function (src) {

    if (!src || src === 'null' || src === 'undefined') {
        return;
    }

    const img = document.getElementById('fullscreenImg');
    const modal = document.getElementById('fullscreenModal');

    if (!img || !modal) return;

    img.src = src;
    modal.style.display = 'flex';
};


window.closeFullscreenImage = function () {

    const modal =
        document.getElementById('fullscreenModal');

    const img =
        document.getElementById('fullscreenImg');

    if (!modal) return;

    modal.style.display = 'none';

    if (img) {
        img.src = '';
    }
};


/* ============================================================
   DESIGN NAME CLEAN
============================================================ */

function cleanDesignName(str) {

    return str
        ? str.toString()
            .replace('#', '')
            .trim()
            .toLowerCase()
        : '';
}


/* ============================================================
   BITMAP
============================================================ */

function loadBitmapImage() {

    const designElement =
        document.getElementById('designNo');

    const bitmapContainer =
        document.getElementById('bitmapDisplayContainer');

    if (!designElement || !bitmapContainer) return;

    let activeDesign =
        designElement.value ||
        localStorage.getItem('selected_design_number');

    const designSpecs =
        getLocalObject('design_specs');

    const clean =
        activeDesign
            ? activeDesign.toString()
                .replace('#', '')
                .trim()
                .toLowerCase()
            : '';

    const specKey =
        Object.keys(designSpecs).find(function (k) {

            return cleanDesignName(k) === clean;

        }) || activeDesign;

    let imgHtml = '';

    if (
        activeDesign &&
        designSpecs[specKey] &&
        designSpecs[specKey].bitmap
    ) {

        const b64 = designSpecs[specKey].bitmap;

        imgHtml =
            `<img src="${b64}"
                  alt="Design Bitmap"
                  onclick="openFullscreenImage(this.src)"
                  title="Click to view full screen">`;
    }


    const oldCheckbox =
        document.getElementById('top_completed_status');

    const wasChecked =
        oldCheckbox ? oldCheckbox.checked : false;


    const checkboxHtml =
        `<div class="completed-checkbox">
            <input type="checkbox"
                   id="top_completed_status"
                   onchange="quickCompleteToggle()">
            <label for="top_completed_status">
                Completed
            </label>
        </div>`;


    bitmapContainer.innerHTML =
        checkboxHtml + imgHtml;


    if (wasChecked) {

        const newCheckbox =
            document.getElementById('top_completed_status');

        if (newCheckbox) {
            newCheckbox.checked = true;
        }
    }
}


/* ============================================================
   DESIGN DROPDOWN (UPGRADED TO DATALIST)
============================================================ */

function loadDesignDropdown() {

    const preDesigns =
        getLocalArray('pre_design_numbers');

    const designMasters =
        getLocalArray('design_masters_data');

    const designSpecs =
        getLocalObject('design_specs');

    const partyOrders =
        getLocalArray('party_orders_data');

    const allDesigns = new Set();

    preDesigns.forEach(function (d) {
        if (d !== null && d !== undefined && d !== '') {
            allDesigns.add(d);
        }
    });

    designMasters.forEach(function (d) {
        if (!d || typeof d !== 'object') return;
        const value = d.name || d.designNo;
        if (value) {
            allDesigns.add(value);
        }
    });

    Object.keys(designSpecs).forEach(function (k) {
        if (k) {
            allDesigns.add(k);
        }
    });

    partyOrders.forEach(function (o) {
        if (!o || typeof o !== 'object') return;
        const value = o.designNumber || o.designNo;
        if (value) {
            allDesigns.add(value);
        }
    });

    const datalist = document.getElementById('designList');
    if (datalist) {
        datalist.innerHTML = '';
        Array.from(allDesigns).filter(Boolean).forEach(function (d) {
            const option = document.createElement('option');
            option.value = d;
            datalist.appendChild(option);
        });
    }

    const activeDesign = localStorage.getItem('selected_design_number');
    const designElement = document.getElementById('designNo');

    if (activeDesign && Array.from(allDesigns).some(d => cleanDesignName(d) === cleanDesignName(activeDesign))) {
        if (designElement) designElement.value = activeDesign;
        loadDesignData();
    } else {
        loadBitmapImage();
    }
}


/* ============================================================
   ON LOOM WIDTH
============================================================ */

function calculateOnloomWidth() {

    const baseReed =
        parseFloat(
            currentBaseSpecs.reed ||
            currentBaseSpecs.baseReed
        ) || 0;


    const baseWidth =
        parseFloat(
            currentBaseSpecs.width ||
            currentBaseSpecs.baseWidth
        ) || 0;


    const reedElement =
        document.getElementById('infoReed');

    const widthElement =
        document.getElementById('infoWidth');


    if (!reedElement || !widthElement) return;


    const onloomReed =
        parseFloat(reedElement.value) || 0;


    if (
        baseWidth > 0 &&
        baseReed > 0 &&
        onloomReed > 0
    ) {

        widthElement.value =
            ((baseReed * baseWidth) / onloomReed)
                .toFixed(2);

    } else if (baseWidth > 0) {

        widthElement.value =
            baseWidth.toFixed(2);
    }
}


/* ============================================================
   LOAD DESIGN DATA
============================================================ */

function loadDesignData() {

    const designElement =
        document.getElementById('designNo');

    if (!designElement) return;

    const dNo =
        designElement.value;

    loadBitmapImage();

    if (dNo) {
        localStorage.setItem(
            'selected_design_number',
            dNo
        );
    }

    const linesContainer =
        document.getElementById('warpLinesContainer');

    const rangesContainer =
        document.getElementById('warpRangesContainer');

    if (linesContainer) {
        linesContainer.innerHTML = '';
    }

    if (rangesContainer) {
        rangesContainer.innerHTML = '';
    }

    const saveBtn =
        document.getElementById('saveBtnTxt');

    document.getElementById('infoCount1').value = '';
    document.getElementById('infoCount2').value = '';
    document.getElementById('infoWeft1').value = '';
    document.getElementById('infoWeft2').value = '';
    document.getElementById('infoOrderMtr').value = '';
    document.getElementById('infoTopBeam').value = '';
    document.getElementById('infoType').value = 'Plain';
    document.getElementById('infoReed').value = '';
    document.getElementById('infoPick').value = '';
    document.getElementById('infoWidth').value = '';

    const topCheckbox =
        document.getElementById('top_completed_status');

    if (topCheckbox) {
        topCheckbox.checked = false;
    }

    if (!dNo) {
        if (saveBtn) {
            saveBtn.innerText = "💾 Save";
        }
        currentBaseSpecs = {};
        loadDefaultRow();
        refreshBulkColorDropdown();
        return;
    }

    const cleanDNo = cleanDesignName(dNo);
    const specs = getLocalObject('design_specs');

    const specKey = Object.keys(specs).find(function (k) {
        return cleanDesignName(k) === cleanDNo;
    }) || dNo;

    currentBaseSpecs = specs[specKey] || {};

    const orders = getLocalArray('party_orders_data');
    const matchedOrder = orders.find(function (o) {
        return cleanDesignName(o.designNumber || o.designNo || o.designName) === cleanDNo;
    }) || null;

    const masters = getLocalArray('design_masters_data');
    const found = masters.find(function (m) {
        return cleanDesignName(m.name || m.designNo) === cleanDNo;
    }) || null;

    const specStatus = (
        currentBaseSpecs.status ||
        (matchedOrder && matchedOrder.status) ||
        (found && found.status) ||
        ''
    ).toLowerCase();

    if (specStatus === 'completed') {
        const cb = document.getElementById('top_completed_status');
        if (cb) {
            cb.checked = true;
        }
    }

    // 🟢 FIXED MAPPING: Pull EXACT values stored in Design Master 🟢
    
    // Warp 1 & Warp 2
    let c1Resolved =
        (matchedOrder && matchedOrder.baseBeamCount) ||
        (found && (found.count1 || found.warp1)) ||
        currentBaseSpecs.baseBeamCount ||
        currentBaseSpecs.warp ||
        currentBaseSpecs.count1 ||
        '';

    let c2Resolved =
        (matchedOrder && matchedOrder.topBeamCount) ||
        (found && (found.count2 || found.warp2)) ||
        currentBaseSpecs.topBeamCount ||
        currentBaseSpecs.warp2 ||
        currentBaseSpecs.count2 ||
        '';
    if (c2Resolved === '-') c2Resolved = '';

    // Weft 1 & Weft 2
    let weft1Resolved =
        (matchedOrder && matchedOrder.weftCount) ||
        (found && (found.weftCount || found.weft)) ||
        currentBaseSpecs.weftCount ||
        currentBaseSpecs.weft ||
        '';

    let weft2Resolved =
        (matchedOrder && matchedOrder.weft2) ||
        (found && found.weft2) ||
        currentBaseSpecs.weft2 ||
        '';

    let onloomReedResolved =
        (matchedOrder && matchedOrder.onloomReed) ||
        (found && found.onloomReed) ||
        currentBaseSpecs.onloomReed ||
        (matchedOrder && matchedOrder.reed) ||
        (found && found.reed) ||
        currentBaseSpecs.reed ||
        '';

    let onloomPickResolved =
        (matchedOrder && matchedOrder.onloomPick) ||
        (found && found.onloomPick) ||
        currentBaseSpecs.onloomPick ||
        (matchedOrder && matchedOrder.pick) ||
        (found && found.pick) ||
        currentBaseSpecs.pick ||
        '';

    let onloomWidthResolved =
        (matchedOrder && matchedOrder.onloomWidth) ||
        (found && found.onloomWidth) ||
        currentBaseSpecs.onloomWidth ||
        (matchedOrder && matchedOrder.width) ||
        (found && found.width) ||
        currentBaseSpecs.width ||
        '';

    let matchedProdMtr = 0;
    if (matchedOrder) {
        matchedProdMtr =
            parseFloat(
                matchedOrder.orderMtr ||
                matchedOrder.productionMeter ||
                matchedOrder.prodMtr ||
                0
            ) || 0;
    }

    document.getElementById('infoCount1').value = c1Resolved;
    document.getElementById('infoCount2').value = c2Resolved;
    document.getElementById('infoWeft1').value = weft1Resolved;
    document.getElementById('infoWeft2').value = weft2Resolved;

    document.getElementById('infoReed').value = onloomReedResolved;
    document.getElementById('infoPick').value = onloomPickResolved;
    document.getElementById('infoWidth').value = onloomWidthResolved;

    if (found && Array.isArray(found.warpLines) && found.warpLines.length > 0) {
        if (saveBtn) {
            saveBtn.innerText = "✏️ Update";
        }

        const finalMtrToFill = matchedProdMtr > 0 ? matchedProdMtr : (found.orderMtr || '');
        document.getElementById('infoOrderMtr').value = finalMtrToFill;
        document.getElementById('infoTopBeam').value = found.topBeam || '';

        document.getElementById('infoType').value =
            found.type ||
            (matchedOrder && matchedOrder.weaveType) ||
            currentBaseSpecs.weaveType ||
            currentBaseSpecs.weave ||
            'Plain';

        found.warpLines.forEach(function (l) {
            if (!l) return;
            addWarpLine(
                l.count || '',
                l.color || '',
                l.beam || 'Ground',
                l.ends || ''
            );
        });

        if (Array.isArray(found.warpRanges)) {
            found.warpRanges.forEach(function (r) {
                if (!r) return;
                addWarpRange(r.start || '', r.end || '', r.set || '');
            });
        }
    } else {
        if (saveBtn) {
            saveBtn.innerText = "💾 Save";
        }

        if (matchedProdMtr > 0) {
            document.getElementById('infoOrderMtr').value = matchedProdMtr;
        }

        document.getElementById('infoType').value =
            (matchedOrder && matchedOrder.weaveType) ||
            currentBaseSpecs.weaveType ||
            currentBaseSpecs.weave ||
            'Plain';

        loadDefaultRow();
    }

    updateLineNumbers();
    refreshBulkColorDropdown();
}


/* ============================================================
   DEFAULT ROW
============================================================ */

function loadDefaultRow() {

    const container =
        document.getElementById('warpLinesContainer');

    if (!container) return;

    container.innerHTML = '';

    addWarpLine();

    refreshBulkColorDropdown();
}


/* ============================================================
   TOP BEAM
============================================================ */

function calculateTopBeam() {

    const orderElement =
        document.getElementById('infoOrderMtr');

    const topBeamInput =
        document.getElementById('infoTopBeam');


    if (!orderElement || !topBeamInput) return;


    const orderMtr =
        parseFloat(orderElement.value) || 0;


    const topBeamStr =
        topBeamInput.value.trim();


    if (orderMtr > 0 && topBeamStr) {

        const val =
            parseFloat(
                topBeamStr
                    .replace('+', '')
                    .replace('%', '')
                    .trim()
            ) || 0;


        if (
            topBeamStr.includes('%') ||
            (
                val > 0 &&
                val < 50 &&
                !topBeamStr.includes('.')
            )
        ) {

            topBeamInput.value =
                (
                    orderMtr +
                    (orderMtr * val / 100)
                ).toFixed(2);
        }
    }
}


/* ============================================================
   COPY DESIGN (UPGRADED FOR DATALIST)
============================================================ */

async function copyToNewDesign() {

    const designElement =
        document.getElementById('designNo');

    if (!designElement) return;


    const currentDNo =
        designElement.value;


    if (!currentDNo) {

        alert(
            "முதலில் எந்த டிசைனை காப்பி செய்ய வேண்டுமோ அதை செலக்ட் செய்யுங்கள் ப்ரோ!"
        );

        return;
    }


    let newDNo =
        prompt(
            `'${currentDNo}' டிசைனை காப்பி செய்கிறீர்கள்.\n\nபுதிய டிசைன் நம்பரை (New Design Number) உள்ளிடவும்:`
        );


    if (!newDNo || newDNo.trim() === '') {
        return;
    }


    newDNo =
        newDNo.trim();


    const preDesignList =
        getLocalArray('pre_design_numbers');


    const alreadyExists =
        preDesignList.some(function (d) {

            return cleanDesignName(d) ===
                   cleanDesignName(newDNo);

        });


    if (alreadyExists) {

        alert(
            "இந்த டிசைன் நம்பர் ஏற்கனவே உள்ளது! வேறு நம்பரை கொடுக்கவும்."
        );

        return;
    }


    preDesignList.push(newDNo);

    localStorage.setItem(
        'pre_design_numbers',
        JSON.stringify(preDesignList)
    );


    try {

        if (window.firebaseSave) {

            await window.firebaseSave(
                'pre_design_numbers',
                preDesignList
            );
        }

    } catch (e) {

        console.error(
            'Firebase pre-design save error:',
            e
        );
    }


    if (designElement) {
        designElement.value = newDNo;
        const datalist = document.getElementById('designList');
        if (datalist) {
            const option = document.createElement('option');
            option.value = newDNo;
            datalist.appendChild(option);
        }
    }

    localStorage.setItem(
        'selected_design_number',
        newDNo
    );


    currentBaseSpecs = {};


    document.getElementById('saveBtnTxt').innerText =
        "💾 Save";


    const cb =
        document.getElementById(
            'top_completed_status'
        );

    if (cb) {
        cb.checked = false;
    }


    alert(
        `✅ '${newDNo}' டிசைனுக்கு வெற்றிகரமாக காப்பி செய்யப்பட்டது!\n\nஇப்போது நீங்கள் 'Bulk Color Changer' மூலம் கலரை மாற்றிவிட்டு 'Save' பட்டனை அழுத்தவும்.`
    );
}


/* ============================================================
   BULK COLOR DROPDOWN
============================================================ */

function refreshBulkColorDropdown() {

    const colorsSet =
        new Set();


    document
        .querySelectorAll('.inp-color')
        .forEach(function (inp) {

            const val =
                inp.value.trim();

            if (val) {
                colorsSet.add(val);
            }

        });


    const select =
        document.getElementById('bulkOldColor');


    if (!select) return;


    select.innerHTML =
        '<option value="">Select Old Color</option>';


    colorsSet.forEach(function (c) {

        const option =
            document.createElement('option');

        option.value = c;
        option.textContent = c;

        select.appendChild(option);

    });
}


/* ============================================================
   BULK COLOR CHANGE
============================================================ */

function applyBulkColorChange() {

    const oldColor =
        document.getElementById(
            'bulkOldColor'
        ).value;


    const newColor =
        document.getElementById(
            'bulkNewColor'
        ).value.trim();


    if (!oldColor || !newColor) {

        alert(
            "Please select the Old Color and type the New Color!"
        );

        return;
    }


    if (
        confirm(
            `Are you sure you want to change all '${oldColor}' to '${newColor}'?`
        )
    ) {

        let changedCount = 0;


        document
            .querySelectorAll('.inp-color')
            .forEach(function (inp) {

                if (inp.value.trim() === oldColor) {

                    inp.value = newColor;

                    changedCount++;
                }

            });


        document.getElementById(
            'bulkOldColor'
        ).value = '';


        document.getElementById(
            'bulkNewColor'
        ).value = '';


        refreshBulkColorDropdown();


        alert(
            `${changedCount} rows updated successfully! ✅`
        );
    }
}


/* ============================================================
   ADD WARP LINE (🟢 ENHANCED AUTO-FILL FOR COUNT 🟢)
============================================================ */

function addWarpLine(
    count = '',
    color = '',
    beam = 'Ground',
    ends = '',
    insertAfterElem = null
) {
    // 🟢 NEW: Auto-fill the count from General Specs by default, but it remains editable! 🟢
    if (!count) {
        const c1 = document.getElementById('infoCount1');
        if (c1 && c1.value) {
            count = c1.value;
        }
    }

    const container =
        document.getElementById(
            'warpLinesContainer'
        );


    if (!container) return;


    const row =
        document.createElement('div');


    row.className =
        'row-grid line-item';


    row.innerHTML = `
        <div class="line-no"></div>

        <input
            type="text"
            class="inp-count"
            placeholder="Count"
            value="${escapeHtmlAttribute(count)}"
        >

        <input
            type="text"
            class="inp-color"
            placeholder="Colour"
            value="${escapeHtmlAttribute(color)}"
            onblur="refreshBulkColorDropdown()"
            onkeydown="
                if(event.key==='Enter'){
                    event.preventDefault();
                    let bm=this.parentElement.querySelector('.inp-beam');
                    if(bm) bm.focus();
                }
            "
        >

        <select
            class="inp-beam"
            onkeydown="
                if(event.key==='Enter'){
                    event.preventDefault();
                    this.value =
                        (this.value === 'Ground')
                        ? 'Top Beam'
                        : 'Ground';

                    let en=this.parentElement.querySelector('.inp-ends');
                    if(en) en.focus();
                }
            "
        >
            <option value="Ground"
                ${beam === 'Ground' ? 'selected' : ''}>
                Ground
            </option>

            <option value="Top Beam"
                ${beam === 'Top Beam' ? 'selected' : ''}>
                Top Beam
            </option>
        </select>

        <input
            type="number"
            class="inp-ends"
            placeholder="Ends"
            value="${escapeHtmlAttribute(ends)}"
            onkeydown="
                if(event.key==='Enter'){
                    event.preventDefault();

                    addWarpLine(
                        '',
                        '',
                        'Ground',
                        '',
                        this.parentElement
                    );

                    setTimeout(()=>{
                        let next =
                            this.parentElement
                                .nextElementSibling
                                ?.querySelector('.inp-count');

                        if(next) next.focus();
                    },50);
                }
            "
        >

        <div class="action-cell-row">

            <button
                class="btn-insert-small"
                onclick="
                    addWarpLine(
                        '',
                        '',
                        'Ground',
                        '',
                        this.parentElement.parentElement
                    );
                "
                title="Insert row below">
                +
            </button>

            <button
                class="btn-del-small"
                onclick="
                    this.parentElement.parentElement.remove();
                    updateLineNumbers();
                    refreshBulkColorDropdown();
                "
                title="Delete row">
                ×
            </button>

        </div>
    `;


    if (
        insertAfterElem &&
        insertAfterElem.nextSibling
    ) {

        container.insertBefore(
            row,
            insertAfterElem.nextSibling
        );

    } else {

        container.appendChild(row);
    }


    updateLineNumbers();
    refreshBulkColorDropdown();
}


/* ============================================================
   HTML ATTRIBUTE ESCAPE
============================================================ */

function escapeHtmlAttribute(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}


/* ============================================================
   ADD RANGE
============================================================ */

function addWarpRange(
    start = '',
    end = '',
    set = ''
) {

window.saveWarpDesign = async function () {

        );

        return;
    }

        document.getElementById('designNo');

        currentBaseSpecs &&
        typeof currentBaseSpecs === 'object' &&
        Object.keys(currentBaseSpecs).length > 0;

                m.name ||
                m.designNo

            m.warpLines.length > 0;

        !hasCurrentBaseSpecs &&

    const ranges = [];

        if (saveBtn) {

function renderSavedList() {

    const masters =
        getLocalArray(

        );


    const tbody =
        document.getElementById(
            'savedPatternsBody'
        );


    if (!tbody) return;


    tbody.innerHTML = '';


    let hasData = false;


    masters.forEach(function (m) {

        if (
            !m ||
            !Array.isArray(m.warpLines) ||
            m.warpLines.length === 0
        ) {
            return;
        }


        hasData = true;


        if (!m.status) {
            m.status = "running";
        }


        const designName =
            m.name ||
            m.designNo ||
            '-';


        const statusColor =
            m.status === 'running'
                ? '#D97706'
                : '#526E51';


        const safeDesign =
            String(designName)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");


        const statusBtn =
            m.status === 'running'

                ? `<button
                    class="action-complete"
                    onclick="toggleStatus('${safeDesign}', 'completed')">
                    Complete
                   </button>`

                : `<button
                    class="action-running"
                    onclick="toggleStatus('${safeDesign}', 'running')">
                    Running
                   </button>`;


        tbody.innerHTML += `

            <tr>

                <td>
                    <b>${escapeHtmlText(designName)}</b>
                </td>

    }
}


/* ============================================================
   TEXT ESCAPE
============================================================ */

function escapeHtmlText(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

                                display:inline-block;
                                padding-right:15px;
                                color:#2F4F38;
                              ">
                                ${item.ends}
                              </span>`;


                    const colorTamil =
                        typeof translateColorToTamil === 'function'
                            ? translateColorToTamil(
                                item.color
                              )
                            : item.color;


                    blockHtml += `

                        <tr>

                            <td style="
                                ${tdStyle}
                                font-weight:700;
                                color:#4A554A;
                            ">
                                ${item.lineNo}
                            </td>

                            <td style="${tdStyle}">
                                ${escapeHtmlText(
                                    item.count || '-'
                                )}
                            </td>

                            <td style="${tdStyleColor}">
                                ${escapeHtmlText(
                                    colorTamil
                                )}
                            </td>

                            <td style="
                                ${tdStyle}
                                font-weight:bold;
                            ">
                                ${endsDisplay}
                            </td>
                    `;


                    if (index === 0) {

                        blockHtml += `

                            <td
                                rowspan="${blockLines.length}"
                                style="${tdStyleLast}"
                            >

                                <div style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:flex-start;
                                    gap:4px;
                                    font-weight:700;
                                    font-size:16px;
                                ">

                                    <span style="
                                        font-size:${blockLines.length * 18}px;
                                        font-weight:300;
                                        line-height:0.5;
                                        display:inline-block;
                                    ">
                                        }
                                    </span>

                                    <span>
                                        X ${set}
                                        =
                                        <span style="color:#D97706">
                                            ${total}
                                        </span>
                                    </span>

                                </div>

                            </td>
                        `;
                    }


                    blockHtml += `
                        </tr>
                    `;
                }
            );


            i = end;

            blockLineCount =
                blockLines.length;


        } else {

            const item =
                Object.assign(
                    {},
                    warpLines[i]
                );


            item.lineNo =
                i + 1;


            if (
                item.beam ===
                'Top Beam'
            ) {

                topTotal +=
                    parseFloat(
                        item.ends
                    ) || 0;

            } else {

                groundTotal +=
                    parseFloat(
                        item.ends
                    ) || 0;
            }


            flatPattern.push({

                lineNo:
                    item.lineNo,

                count:
                    item.count || '-',

                color:
                    item.color || '-',

                ends:
                    parseFloat(
                        item.ends
                    ) || 0,

                beam:
                    item.beam

            });


            const endsDisplay =
                item.beam === 'Top Beam'

                    ? `<span style="
                        display:inline-block;
                        padding-left:15px;
                        color:#D97706;
                      "
                      title="Top Beam">
                        ${item.ends}
                      </span>`

                    : `<span style="
                        display:inline-block;
                        padding-right:15px;
                        color:#2F4F38;
                      ">
                        ${item.ends}
                      </span>`;


            const colorTamil =
                typeof translateColorToTamil === 'function'
                    ? translateColorToTamil(
                        item.color
                      )
                    : item.color;


            blockHtml += `

                <tr>

                    <td style="
                        ${tdStyle}
                        font-weight:700;
                        color:#4A554A;
                    ">
                        ${item.lineNo}
                    </td>

                    <td style="${tdStyle}">
                        ${escapeHtmlText(
                            item.count || '-'
                        )}
                    </td>

                    <td style="${tdStyleColor}">
                        ${escapeHtmlText(
                            colorTamil
                        )}
                    </td>

                    <td style="
                        ${tdStyle}
                        font-weight:bold;
                    ">
                        ${endsDisplay}
                    </td>

                    <td style="${tdStyleLast}"></td>

                </tr>
            `;


            i++;

            blockLineCount = 1;
        }


        if (
            currentLinesInCol1 <
            MAX_LINES_COL1
        ) {

            col1Html += blockHtml;

            currentLinesInCol1 +=
                blockLineCount;

        } else {

            col2Html += blockHtml;
        }
    }


    const finalTotal =
        groundTotal +
        topTotal;


    const finalTotalDisplay =
        topTotal > 0

            ? `<span style="color:#3F5A3E;">
                    ${groundTotal}
                    <span style="font-size:9px;">
                        (Grnd)
                    </span>
               </span>
               +
               <span style="color:#D97706;">
                    ${topTotal}
                    <span style="font-size:9px;">
                        (Top)
                    </span>
               </span>
               =
               ${finalTotal}`

            : `${finalTotal}`;


    let html =
        headerHtml;


    const tableHeader = `

        <tr style="background:#EAF0EA;">

            <th style="
                padding:6px;
                text-align:center;
                color:#2F4F38;
                text-transform:uppercase;
                font-size:10px;
                border-bottom:2px solid #4A7C59;
                width:10%;
            ">
                No
            </th>

            <th style="
                padding:6px;
                text-align:center;
                color:#2F4F38;
                text-transform:uppercase;
                font-size:10px;
                border-bottom:2px solid #4A7C59;
                width:15%;
            ">
                Count
            </th>

            <th style="
                padding:6px;
                text-align:left;
                color:#2F4F38;
                text-transform:uppercase;
                font-size:10px;
                border-bottom:2px solid #4A7C59;
                width:25%;
            ">
                Colour
            </th>

            <th style="
                padding:6px;
                text-align:center;
                color:#2F4F38;
                text-transform:uppercase;
                font-size:10px;
                border-bottom:2px solid #4A7C59;
                line-height:1.2;
                width:15%;
            ">
                Ends<br>
                <span style="
                    font-size:7px;
                    color:#4A554A;
                ">
                    Grnd|Top
                </span>
            </th>

            <th style="
                padding:6px;
                text-align:left;
                padding-left:10px;
                color:#2F4F38;
                text-transform:uppercase;
                font-size:10px;
                border-bottom:2px solid #4A7C59;
                width:35%;
            ">
                Set
            </th>

        </tr>
    `;


    html += `

        <div
            class="print-flex-row"
            style="
                display:flex;
                gap:20px;
                align-items:flex-start;
                justify-content:space-between;
                width:100%;
            "
        >

            <div
                class="print-col-box"
                style="
                    flex:1;
                    width:48%;
                    background:#FFF;
                "
            >

                <table style="
                    width:100%;
                    border-collapse:collapse;
                    font-size:11px;
                ">

                    ${tableHeader}

                    ${col1Html}

                </table>

            </div>


            <div
                class="print-col-box"
                style="
                    flex:1;
                    width:48%;
                    background:#FFF;
                "
            >
    `;


    if (col2Html !== '') {

        html += `

            <table style="
                width:100%;
                border-collapse:collapse;
                font-size:11px;
            ">

                ${tableHeader}

                ${col2Html}

            </table>
        `;
    }


    html += `

            </div>

        </div>
    `;


    html += `

        <div style="
            margin-top:15px;
            border-top:2px solid #4A7C59;
            padding-top:5px;
            page-break-inside:avoid;
        ">

            <table style="
                width:100%;
                border-collapse:collapse;
                font-size:11px;
                background:#FFF;
            ">

                <tr style="
                    font-weight:bold;
                    font-size:12px;
                    background:#F8FAF8;
                    border-bottom:1px dashed #A0AFA0;
                ">

                    <td style="
                        padding:8px;
                        text-align:right;
                        color:#2F4F38;
                        width:60%;
                    ">
                        Total Pattern Ends:
                    </td>

                    <td style="
                        padding:8px;
                        font-weight:bold;
                        text-align:left;
                        padding-left:15px;
                        white-space:nowrap;
                        color:#1E2B23;
                    ">
                        ${finalTotalDisplay}
                    </td>

                </tr>
    `;


    const grandTotalPattern =
        groundTotal +
        topTotal;


    if (
        baseReed > 0 &&
        baseWidth > 0 &&
        grandTotalPattern > 0
    ) {

        const repeats =
            Math.floor(
                baseTotalEnds /
                grandTotalPattern
            );


        const remEnds =
            baseTotalEnds %
            grandTotalPattern;


        const countTotals = {};


        flatPattern.forEach(
            function (item) {

                countTotals[item.count] =
                    (
                        countTotals[item.count] ||
                        0
                    ) +
                    (
                        item.ends *
                        repeats
                    );

            }
        );


        let endsToDistribute =
            remEnds;


        for (
            const item of flatPattern
        ) {

            if (
                endsToDistribute <= 0
            ) {
                break;
            }


            const take =
                Math.min(
                    item.ends,
                    endsToDistribute
                );


            countTotals[item.count] =
                (
                    countTotals[item.count] ||
                    0
                ) + take;


            endsToDistribute -=
                take;
        }


        html += `

            <tr style="
                font-weight:700;
                font-size:12px;
                background:#FFFFFF;
                color:#2F4F38;
                border-bottom:1px dashed #A0AFA0;
            ">

                <td colspan="2"
                    style="
                        padding:10px;
                        text-align:center;
                    "
                >

                    ${repeats}
                    Set +
                    ${remEnds}
                    Ends =

                    <span style="
                        font-size:13px;
                        color:#1E2B23;
                    ">
                        ${baseTotalEnds}
                    </span>

                    Total Ends

                </td>

            </tr>
        `;


        const breakdownHtml =
            Object.keys(countTotals)
                .map(function (c) {

                    return `
                        <span style="color:#1E2B23;">
                            <b>${escapeHtmlText(c)}</b>:
                            ${countTotals[c]}
                            Ends
                        </span>
                    `;

                })
                .join(
                    ' &nbsp;&nbsp;|&nbsp;&nbsp; '
                );


        html += `

            <tr style="
                font-size:11px;
                background:#EAF0EA;
            ">

                <td colspan="2"
                    style="
                        padding:10px;
                        text-align:center;
                    "
                >

                    <span style="
                        color:#4A7C59;
                        font-weight:800;
                        margin-right:8px;
                        text-transform:uppercase;
                    ">
                        Count Wise Total:
                    </span>

                    ${breakdownHtml}

                </td>

            </tr>
        `;
    }


    html += `

            </table>

        </div>
    `;


    const previewContent =
        document.getElementById(
            'previewContent'
        );


    if (!previewContent) return;


    previewContent.innerHTML =
        html;


    openModal(
        'previewModal'
    );
}

/* ============================================================
   3D PREVIEW DATA LINK
============================================================ */
function update3DPreviewData() {
    try {
        let colorInputs = document.querySelectorAll('.inp-color');
        let endsInputs = document.querySelectorAll('.inp-ends');

        let color1 = colorInputs.length > 0 ? colorInputs[0].value : "White";
        let ends1 = endsInputs.length > 0 ? endsInputs[0].value : "60";

        let color2 = colorInputs.length > 1 ? colorInputs[1].value : "Blue";
        let ends2 = endsInputs.length > 1 ? endsInputs[1].value : "60";

        let previewData = [{
            designNo: "🔴 Live Warp Entry Preview", 
            warpColor1: color1,
            warpEnds1: ends1,
            warpColor2: color2,
            warpEnds2: ends2,
            weftColor: "White" 
        }];

        localStorage.setItem('warp_entry_data', JSON.stringify(previewData));
        
    } catch(e) {
        console.error("3D Preview Data Link Error:", e);
    }
}

</script>
